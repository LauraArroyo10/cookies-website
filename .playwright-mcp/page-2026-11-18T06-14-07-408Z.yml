            - paragraph [ref=f2e33]: "Coffee pulp flour is made by processing, drying, and milling the pulp of the coffee fruit. This plant-based ingredient contains dietary fiber and naturally occurring bioactive compounds. It can be used in baked goods such as cookies, cakes, breads, and pancakes. Store in a cool, dry place, protected from moisture and direct sunlight. Net weight: 1 kg."
