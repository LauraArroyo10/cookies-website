      - generic [ref=f2e12]:
        - generic [ref=f2e13]:
          - heading "A New Way to Experience Coffee" [level=2] [ref=f2e14]
          - paragraph [ref=f2e15]: Yayis is a Costa Rican food venture born from a coffee-producing company, driven by the idea of transforming coffee by-products into something valuable, delicious and sustainable.
          - paragraph [ref=f2e16]: Our inspiration comes from coffee pulp, a resource often overlooked during coffee production. By transforming it into flour, we aim to give it a second life, making the most of its nutritional potential, including dietary fiber and naturally occurring compounds, while promoting more responsible and creative food production.
          - heading "More Than Just Cookies" [level=3] [ref=f2e17]
          - paragraph [ref=f2e18]: Our journey begins with our first collection of artisanal crumble cookies, made with coffee pulp flour and created to bring together great flavor, creativity and sustainability. Available in three unique flavors — Honey & Cream, Choco Coffee and Vanilla Caramel — our cookies introduce a new way to enjoy the possibilities of coffee beyond the cup.
          - heading "Our Vision" [level=3] [ref=f2e19]
          - paragraph [ref=f2e20]: Rooted in Costa Rica's coffee culture, we aspire to introduce Yayis to local consumers and international visitors, sharing an innovative product that reflects our commitment to sustainability and local creativity.
          - paragraph [ref=f2e21]: "Our vision goes beyond cookies. We hope to expand our product line, explore new ways to use coffee pulp and eventually open our own café: a space where coffee, delicious food and conscious consumption come together."
          - paragraph [ref=f2e22]: Yayis — Giving coffee a second life, one bite at a time.
        - img "Hands holding coffee pulp" [ref=f2e23]
